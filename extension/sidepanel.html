<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Source Verifier</title>
<style>
  :root{
    --fg:#1A1A1A; --dim:#6B7280; --line:#E5E7EB;
    --green:#16A34A; --amber:#CA8A04; --red:#DC2626; --gray:#9CA3AF; --r:6px;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:20px 18px 40px; background:#fff; color:var(--fg);
    font:14px/1.65 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-size:13px; font-weight:600; margin:0 0 2px}
  .sub{font-size:12px; color:var(--dim); margin:0 0 22px}

  .badge{display:inline-block; font-size:10px; font-weight:600; letter-spacing:.06em;
         padding:3px 9px; border-radius:var(--r); color:#fff; margin-bottom:14px}
  .b-SUPPORTED{background:var(--green)} .b-PARTIAL{background:var(--amber)}
  .b-UNSUPPORTED{background:var(--red)} .b-UNREACHABLE{background:var(--gray)}

  .label{font-size:10px; letter-spacing:.08em; color:var(--dim);
         text-transform:uppercase; margin:18px 0 6px}
  .quote{font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,monospace;
         border-left:2px solid var(--green); padding:2px 0 2px 12px; color:#374151}
  .quote.amber{border-left-color:var(--amber)}
  .none{font-size:12px; color:var(--red); padding:2px 0 2px 12px; border-left:2px solid var(--line)}
  .quoted{font-size:12px; color:var(--dim); font-style:italic; margin:0}
  .reason{font-size:13px; margin:0}
  .url{font-size:11px; word-break:break-all; color:var(--dim)}
  .url a{color:var(--dim)}
  .url.dead{color:var(--red); text-decoration:line-through}
  .jump{font-size:10px; color:var(--dim); margin-top:4px}
  .fix{background:#F0FDF4; border:1px solid #BBF7D0; border-radius:var(--r); padding:12px 14px; margin-top:16px}
  .fix .label{margin-top:0; color:var(--green)} .fix a{color:var(--green); font-size:11px; word-break:break-all}
  .nofix{background:#FEF2F2; border:1px solid #FECACA; border-radius:var(--r);
         padding:12px 14px; margin-top:16px; font-size:12px; color:#991B1B}
  .work{background:#FFFBEB; border:1px solid #FDE68A; border-radius:var(--r);
        padding:12px 14px; margin-top:16px; font-size:12px; color:#92400E}
  .tried{font-size:11px; color:var(--dim); margin-top:10px; line-height:1.6}
  .tried code{font-size:10px; word-break:break-all}
  .empty{color:var(--dim); font-size:12px}
  .empty b{color:var(--fg)}
  .step{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim); margin:6px 0}
  .spin{width:8px; height:8px; border-radius:50%; background:var(--amber);
        animation:pulse 1s ease-in-out infinite; flex:none}
  .tick{width:8px; height:8px; border-radius:50%; background:var(--green); flex:none}
  .idle{width:8px; height:8px; border-radius:50%; background:var(--line); flex:none}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  button{font:inherit; font-size:12px; padding:7px 14px; border-radius:var(--r);
         border:1px solid var(--line); background:#fff; color:var(--fg); cursor:pointer}
  button:hover{border-color:var(--fg)}
  .foot{margin-top:26px; font-size:11px; color:var(--dim)}
</style>
</head>
<body>
  <h1>Source Verifier</h1>
  <p class="sub">Right-click any link → <b>Verify this source</b></p>
  <div id="out"></div>
  <div class="foot" id="foot"></div>
<script src="sidepanel.js"></script>
</body>
</html>
